
<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Factory ERP" />
    <title>Factory PRODUCTION SYSTEM</title>
    <link rel="icon" type="image/svg+xml" href="/icons/pwa-icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/pwa-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/pwa-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Single stylesheet: theme font options (Settings) + Cairo weights for charts/print -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&family=Rubik:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <style>
      /* Cold boot: branded splash */
      #html-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: linear-gradient(165deg, var(--splash-brand, #4F46E5) 0%, var(--splash-brand-dark, #3b34b0) 100%);
        color: #fff;
      }
      #html-splash img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
      }
      #html-splash p {
        margin: 0;
        font-family: 'IBM Plex Sans Arabic', 'Noto Sans Arabic', 'Cairo', system-ui, sans-serif;
        font-size: 15px;
        font-weight: 600;
        opacity: 0.9;
      }
      #html-splash .html-splash-bar {
        width: 160px;
        height: 3px;
        background: rgba(255, 255, 255, 0.22);
        border-radius: 99px;
        overflow: hidden;
      }
      #html-splash .html-splash-bar span {
        display: block;
        height: 100%;
        width: 40%;
        background: #fff;
        border-radius: 99px;
        animation: html-splash-slide 1.4s ease-in-out infinite;
      }
      @keyframes html-splash-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }

      /* Warm F5: app-shell skeleton (no branded splash) — keep in sync with AppShellSkeleton */
      #html-splash.html-splash--warm {
        display: block;
        background: #f7f9fc;
        color: #0f172a;
        padding: 0;
        gap: 0;
      }
      #html-splash.html-splash--warm > .html-splash-cold {
        display: none !important;
      }
      #html-splash.html-splash--warm .html-splash-warm {
        display: flex !important;
        min-height: 100%;
        min-height: 100dvh;
      }
      #html-splash .html-splash-warm {
        display: none;
      }
      #html-splash .html-splash-warm__sidebar {
        display: none;
        width: 52px;
        flex-shrink: 0;
        border-left: 1px solid #e5e7eb;
        background: #fff;
        padding: 12px 8px;
        gap: 10px;
        flex-direction: column;
        align-items: center;
      }
      @media (min-width: 1024px) {
        #html-splash .html-splash-warm__sidebar {
          display: flex;
        }
      }
      #html-splash .html-splash-warm__main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #html-splash .html-splash-warm__topbar {
        height: 52px;
        border-bottom: 1px solid #e5e7eb;
        background: #fff;
        display: flex;
        align-items: center;
        padding: 0 16px;
        gap: 10px;
      }
      #html-splash .html-splash-warm__content {
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #html-splash .html-splash-bone {
        background: #e5e7eb;
        border-radius: 8px;
        animation: html-splash-pulse 1.5s ease-in-out infinite;
      }
      @keyframes html-splash-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #html-splash .html-splash-bone,
        #html-splash .html-splash-bar span {
          animation: none !important;
        }
      }
    </style>
    <script>
      (function () {
        var POLICY = 'no-pwa-precache-v1';
        var KEY = 'erp_client_cache_stamp';
        try {
          var stamp = localStorage.getItem(KEY) || '';
          if (stamp.indexOf(POLICY) === 0) return;
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (reg) { reg.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) { caches.delete(key); });
            });
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <script>
      /**
       * Warm F5 detection — prefix must match lib/appSessionCache.ts APP_SESSION_CACHE_PREFIX.
       * Switches static splash to shell skeleton before React loads (no branded screens).
       */
      (function () {
        var PREFIX = 'erp.appSession.v1.';
        var TTL_MS = 12 * 60 * 60 * 1000;
        function hasWarmSession() {
          try {
            var keys = Object.keys(localStorage);
            for (var i = 0; i < keys.length; i++) {
              var key = keys[i];
              if (key.indexOf(PREFIX) !== 0) continue;
              var raw = localStorage.getItem(key);
              if (!raw) continue;
              var parsed = JSON.parse(raw);
              if (!parsed || !parsed.userProfile || !parsed.userProfile.isActive) continue;
              if (Date.now() - Number(parsed.cachedAt || 0) > TTL_MS) continue;
              return true;
            }
          } catch (e) { /* ignore */ }
          return false;
        }
        window.__ERP_WARM_BOOT__ = hasWarmSession();
        document.documentElement.dataset.erpBoot = window.__ERP_WARM_BOOT__ ? 'warm' : 'cold';
      })();
    </script>
</head>
  <body>
    <div id="html-splash" role="status" aria-live="polite" aria-busy="true" aria-label="جاري التحميل">
      <div class="html-splash-cold">
        <img src="/icons/pwa-icon.svg" alt="" width="80" height="80" decoding="async" />
        <p>جاري تحميل النظام...</p>
        <div class="html-splash-bar" aria-hidden="true"><span></span></div>
      </div>
      <div class="html-splash-warm" aria-hidden="true">
        <aside class="html-splash-warm__sidebar" aria-hidden="true">
          <div class="html-splash-bone" style="width:36px;height:36px;border-radius:999px"></div>
          <div class="html-splash-bone" style="width:36px;height:36px"></div>
          <div class="html-splash-bone" style="width:36px;height:36px"></div>
          <div class="html-splash-bone" style="width:36px;height:36px"></div>
          <div class="html-splash-bone" style="width:36px;height:36px"></div>
          <div class="html-splash-bone" style="width:36px;height:36px;margin-top:auto"></div>
        </aside>
        <div class="html-splash-warm__main">
          <div class="html-splash-warm__topbar">
            <div class="html-splash-bone" style="width:32px;height:32px"></div>
            <div class="html-splash-bone" style="width:140px;height:12px"></div>
            <div style="flex:1"></div>
            <div class="html-splash-bone" style="width:32px;height:32px"></div>
            <div class="html-splash-bone" style="width:32px;height:32px"></div>
          </div>
          <div class="html-splash-warm__content">
            <div class="html-splash-bone" style="width:220px;height:18px"></div>
            <div style="display:flex;gap:12px;flex-wrap:wrap">
              <div class="html-splash-bone" style="flex:1;min-width:140px;height:88px"></div>
              <div class="html-splash-bone" style="flex:1;min-width:140px;height:88px"></div>
              <div class="html-splash-bone" style="flex:1;min-width:140px;height:88px"></div>
              <div class="html-splash-bone" style="flex:1;min-width:140px;height:88px"></div>
            </div>
            <div class="html-splash-bone" style="width:100%;height:220px"></div>
            <div class="html-splash-bone" style="width:100%;height:160px"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('html-splash');
        if (!el || !window.__ERP_WARM_BOOT__) return;
        el.classList.add('html-splash--warm');
        el.setAttribute('aria-label', 'جاري تحميل الصفحة');
        var warm = el.querySelector('.html-splash-warm');
        if (warm) warm.removeAttribute('aria-hidden');
      })();
    </script>

    <script>
      /**
       * Cold splash branding from cached tenant theme (tenant_theme_cache_v1).
       * Keeps first paint aligned with applyAppTheme once React loads.
       */
      (function () {
        var KEY = 'tenant_theme_cache_v1';
        var DEFAULT = '#4F46E5';
        function parseHex(hex) {
          if (!hex || typeof hex !== 'string') return null;
          var h = hex.trim();
          if (h.charAt(0) === '#') h = h.slice(1);
          if (!/^[0-9a-fA-F]{6}$/.test(h) && !/^[0-9a-fA-F]{3}$/.test(h)) return null;
          if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
          return '#' + h.toLowerCase();
        }
        function darken(hex, amount) {
          var h = hex.slice(1);
          var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
          function c(n){ n = Math.round(n*(1-amount)); return Math.max(0,Math.min(255,n)).toString(16).padStart(2,'0'); }
          return '#' + c(r) + c(g) + c(b);
        }
        var primary = DEFAULT;
        try {
          var raw = localStorage.getItem(KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            var next = parseHex(parsed && parsed.primaryColor);
            if (next) primary = next;
          }
        } catch (e) { /* ignore */ }
        var dark = darken(primary, 0.22);
        try {
          document.documentElement.style.setProperty('--color-primary-hex', primary);
          document.documentElement.style.setProperty('--splash-brand', primary);
          document.documentElement.style.setProperty('--splash-brand-dark', dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', primary);
          var el = document.getElementById('html-splash');
          if (el && !el.classList.contains('html-splash--warm')) {
            el.style.background = 'linear-gradient(165deg, ' + primary + ' 0%, ' + dark + ' 100%)';
          }
        } catch (e2) { /* ignore */ }
      })();
    </script>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

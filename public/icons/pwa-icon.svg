<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ForgeOps">
  <defs>
    <linearGradient id="bg" x1="64" y1="40" x2="460" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="80" y1="60" x2="260" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#sheen)"/>
  <g fill="#ffffff">
    <!-- plant body -->
    <rect x="108" y="262" width="296" height="146" rx="20"/>
    <!-- chimneys -->
    <rect x="132" y="164" width="60" height="98" rx="12"/>
    <rect x="206" y="130" width="52" height="132" rx="12"/>
    <!-- roof peaks -->
    <polygon points="222,262 272,222 272,262"/>
    <polygon points="270,262 320,222 320,262"/>
    <polygon points="318,262 368,222 368,262"/>
  </g>
  <!-- windows + door (brand cutouts) -->
  <rect x="146" y="300" width="40" height="38" rx="6" fill="#4F46E5"/>
  <rect x="198" y="300" width="40" height="38" rx="6" fill="#4F46E5"/>
  <rect x="250" y="300" width="40" height="38" rx="6" fill="#4F46E5"/>
  <rect x="302" y="300" width="40" height="38" rx="6" fill="#4F46E5"/>
  <rect x="146" y="348" width="196" height="42" rx="8" fill="#4F46E5"/>
  <!-- status pulse -->
  <circle cx="392" cy="148" r="20" fill="#C7D2FE" fill-opacity="0.9"/>
  <circle cx="392" cy="148" r="9" fill="#ffffff"/>
</svg>

# PR/push coverage moved to ci.yml (test:rules step).
# Keep this workflow for manual emulator-only runs to avoid duplicate CI jobs.
name: Firestore Rules Tests

on:
  workflow_dispatch:

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:rules
